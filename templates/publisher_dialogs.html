<style>
{% include 'publisher_content.css' %}
#search_help_trigger{font:inherit;color:inherit;text-decoration:none}
html.plurk-dialog-open{overflow:hidden;scrollbar-gutter:stable}
#plurk-help-dialog{padding:0;border:0;border-radius:12px;width:min(800px,calc(100% - 48px));max-height:90vh;max-height:90dvh;box-shadow:0 12px 50px #0005;color:#222}
#plurk-help-dialog[data-content="guide"]{width:min(640px,calc(100% - 48px))}
#plurk-help-dialog[open]{display:flex;flex-direction:column}
#plurk-help-dialog::backdrop{background:#0008}
.publisher-dialog-head,.publisher-dialog-foot{flex:none;padding:16px 24px;background:#f7faf8}
.publisher-dialog-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dce5df}
.publisher-dialog-head h2{margin:0;font:600 21px/1.4 system-ui,sans-serif}
.publisher-dialog-head button{font-size:26px;background:none;border:0;cursor:pointer;padding:0 8px;color:#41584b}
.publisher-dialog-body{flex:1 1 auto;overflow:auto;padding:8px 24px 20px;min-height:0;overscroll-behavior:contain}
.publisher-dialog-body section[hidden]{display:none!important}
.publisher-dialog-body section>h1{display:none}
.publisher-dialog-body li{margin:10px 0}
.publisher-dialog-foot{border-top:1px solid #dce5df;text-align:right}
.publisher-dialog-foot button{font:16px system-ui,sans-serif;background:#146b45;color:white;border:0;padding:10px 18px;border-radius:6px;cursor:pointer}
#plurk-help-dialog :focus-visible{outline:3px solid #4a8de4;outline-offset:3px}
@media(max-width:600px){#plurk-help-dialog,#plurk-help-dialog[data-content="guide"]{width:calc(100% - 16px);max-width:none;height:calc(100vh - 16px);height:calc(100dvh - 16px);max-height:none;margin:8px}.publisher-dialog-head,.publisher-dialog-foot{padding:14px 16px}.publisher-dialog-body{padding:8px 16px 20px}}
</style>
<dialog id="plurk-help-dialog" aria-labelledby="plurk-help-title">
<header class="publisher-dialog-head"><h2 id="plurk-help-title">使用說明</h2><button type="button" data-dialog-close aria-label="關閉說明視窗" autofocus>×</button></header>
<div class="publisher-dialog-body publisher-article">
<section data-dialog-content="guide" hidden>{% include 'guide_content.html' %}</section>
<section data-dialog-content="privacy" hidden>{% include 'privacy_content.html' %}</section>
</div>
<footer class="publisher-dialog-foot"><button type="button" data-dialog-close>關閉，回到搜尋</button></footer>
</dialog>
<script>{% include 'publisher_dialogs.js' %}</script>
