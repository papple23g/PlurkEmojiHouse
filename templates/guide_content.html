<div class="help-content">
<ul class="help-steps">
<li>搜尋：輸入關鍵字或點標籤；多標籤用逗號分隔，如<code>開心,貓</code>。<div class="help-tag-demo"><span class="guide-tag">開心</span> <span class="guide-tag">貓</span></div></li>
<li>複製：點圖片複製網址，貼到噗浪即可使用。</li>
<li>收藏：登入後點愛心<svg class="help-icon help-heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21 3.3 12.7C-2 7.5 5.8-.9 12 5.3 18.2-.9 26 7.5 20.7 12.7Z"/></svg>；勾選「顯示我的收藏」查看。</li>
<li>檢視：切換清單／網格<span class="help-views" aria-hidden="true"><svg class="help-icon" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" d="M3 5h3m3 0h12M3 12h3m3 0h12M3 19h3m3 0h12"/></svg><svg class="help-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M3 3h5v5H3zm7 0h5v5h-5zm7 0h5v5h-5zM3 10h5v5H3zm7 0h5v5h-5zm7 0h5v5h-5zM3 17h5v5H3zm7 0h5v5h-5zm7 0h5v5h-5z"/></svg></span>；勾選「組合表符」篩選。</li>
<li>找不到：減少標籤、取消篩選，或按「顯示全部」。</li>
</ul>
<p class="help-rights">圖片權利屬原作者；問題請見<a href="https://hackmd.io/@papple12g/B12AuO2d3" data-author-link>「關於作者」</a>。</p>
</div>
